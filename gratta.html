 // grana metallica
 for(var i=0;i<2600;i++){var a=Math.random()*.16;ctx.fillStyle=Math.random()<.5?'rgba(255,255,255,'+a+')':'rgba(60,64,70,'+a+')';ctx.fillRect(Math.random()*W,Math.random()*H,1.4,1.4)}

 for(var j=0;j<90;j++){var y=Math.random()*H;ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.07)+')';ctx.fillRect(0,y,W,1)}

 if(logo.complete&&logo.naturalWidth){ctx.save();ctx.globalAlpha=.55;ctx.globalCompositeOperation='soft-light';ctx.filter='grayscale(1) contrast(1.1)';ctx.drawImage(logo,0,0,W,H);ctx.restore();

 // riflesso

 ctx.fillStyle=r;ctx.fillRect(0,0,W,H);

}

function scratch(p){
 ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(26,W*.075);
 ctx.beginPath();if(last){ctx.moveTo(last.x,last.y)}else{ctx.moveTo(p.x,p.y)}ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke();last=p;
}
function measure(){
 var s=6,w=Math.floor(cv.width/s),h=Math.floor(cv.height/s),n=0,t=0,d;
 try{d=ctx.getImageData(0,0,cv.width,cv.height).data}catch(e){return 0}
 for(var y=0;y<cv.height;y+=s*2)for(var x=0;x<cv.width;x+=s*2){t++;if(d[(y*cv.width+x)*4+3]<30)n++}
 return n/t}
var tm=0;function check(force){var now=Date.now();if(!force&&now-tm<140)return;tm=now;cleared=measure();window.__cleared=cleared;if(cleared>.4&&!done)finish()}
function finish(){done=true;cv.classList.add('go');bt.classList.add('on');hint.style.opacity=0;coin.style.display='none'}
window.__cleared=0;window.__fade=function(u){cv.style.transition='none';cv.style.opacity=1-u;if(u>=1){done=true;bt.style.transition='none';bt.classList.add('on');hint.style.opacity=0}};
window.__check=function(){check(true);return cleared};
function moveCoin(e){if(e.pointerType==='mouse'||e.pointerType==='pen'){var b=card.getBoundingClientRect();coin.style.left=(e.clientX-b.left)+'px';coin.style.top=(e.clientY-b.top)+'px';coin.style.display=done?'none':'block'}}
cv.addEventListener('pointerdown',function(e){if(done)return;drawing=true;last=null;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);var p=pt(e);scratch(p);moveCoin(e);e.preventDefault()});
cv.addEventListener('pointermove',function(e){moveCoin(e);if(!drawing||done)return;scratch(pt(e));check();e.preventDefault()});
function up(e){drawing=false;last=null;check(true)}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',function(e){coin.style.display='none'});
document.getElementById('cp').onclick=function(){var b=this;function ok(){b.textContent='Codice copiato';setTimeout(function(){b.textContent='Copia il codice'},2200)}

 function fb(){var t=document.createElement('textarea');t.value=C;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){b.textContent=C}document.body.removeChild(t)}};
