<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>旅館</title><style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
#w{--pw:clamp(170px,32vw,270px);--ph:calc(var(--pw)*1.4);font-family:Georgia,"Times New Roman",serif;padding:8px 10px 14px;text-align:center}
#stage{display:flex;justify-content:center;height:calc(var(--ph) + 12px);padding-top:6px}
#bk{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2200px;transition:transform .7s cubic-bezier(.4,.1,.2,1)}
#bk.closed{transform:translateX(calc(var(--pw)/-2))}
.leaf{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);transform-origin:left center;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.4,.1,.2,1)}
.leaf.flip{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fbf8f1;box-shadow:0 6px 18px -8px rgba(0,0,0,.45);cursor:pointer;text-align:left}
.face.b{transform:rotateY(180deg)}
.face.f:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,.22),transparent 9%)}
.face.b:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to left,rgba(0,0,0,.22),transparent 9%)}
.face.c{border-radius:2px 6px 6px 2px}
.cvf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff}
.cvi{position:absolute;inset:0;background:center/cover no-repeat}
.ct{position:relative;text-align:center;padding:12%}
.ct b{display:block;font-weight:normal;font-size:calc(var(--pw)*.085);line-height:1.15;letter-spacing:.03em}
.ct i{display:block;margin-top:.9em;font-style:normal;font-size:calc(var(--pw)*.04);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.bc{position:absolute;inset:0}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;gap:4%;padding:9% 9% 11%;color:#2a2622;font-size:calc(var(--pw)*.05);line-height:1.45}
.pg img{display:block;width:100%;min-height:0;max-height:62%;object-fit:contain;flex:0 1 auto}
.pg.only{padding:0}.pg.only img{max-height:none;height:100%;object-fit:cover;flex:1}
.tx{overflow:auto;flex:1 1 auto;min-height:0;scrollbar-width:thin}
.tx p{margin:0 0 .8em}
.no{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-size:.7em;color:#9a9288}
#nav{display:flex;justify-content:center;gap:14px;margin-top:2px}
#nav button,#mnav button{border:1px solid #cfc9bd;background:#fff;color:#444;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
#meta{margin-top:8px;color:#555;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
#buy{display:inline-block;margin-top:8px;padding:9px 28px;background:#222;color:#fff;text-decoration:none;font-size:14px;letter-spacing:.14em;text-transform:uppercase;border-radius:2px}
#buy:hover{background:#000}
#mob{display:none}
.mcard{position:relative;width:var(--pw);height:var(--ph);margin:0 auto;background:#fbf8f1;box-shadow:0 6px 18px -8px rgba(0,0,0,.45);overflow:hidden;text-align:left}
#mnav{display:flex;justify-content:center;gap:14px;margin-top:8px}
@media(max-width:700px){#w{--pw:min(66vw,260px)}#stage,#nav{display:none}#mob{display:block}}
</style></head><body>
<script type="application/json" id="pkbook">{"title":"旅館","author":"原ロータ","color":"#2f5d7c","cover":"https://casaeditricepeacock.github.io/mensole/ebook/ryokan-giapponese/copertina.jpg","buy":"https://www.studiopeacock.net/ryokan-ebook-giapponese/","label":"購入する","pages":[{"t":"","i":"https://casaeditricepeacock.github.io/mensole/ebook/ryokan-giapponese/pagina-1.jpg"},{"t":"\n\n\n「幸せこそが真の反逆。」","i":""}]}</script>
<div id="w"><div id="stage"><div id="bk" class="closed"><div class="leaf" data-f="1"><div class="face f c"><div class="cvf" style="background-color:#2f5d7c"><div class="cvi" data-k="c"></div></div></div><div class="face b"><div class="pg only"><img data-k="p0" alt=""></div></div></div><div class="leaf" data-f="0"><div class="face f"><div class="pg"><div class="tx"><p></p><p>「幸せこそが真の反逆。」</p></div><span class="no">2</span></div></div></div></div></div>
<div id="nav"><button id="pv" aria-label="Indietro">&#8249;</button><button id="nx" aria-label="Avanti">&#8250;</button></div>
<div id="mob"><div class="mi"><div class="mcard"><div class="cvf" style="background-color:#2f5d7c"><div class="cvi" data-k="c"></div></div></div></div><div class="mi"><div class="mcard pgc"><div class="pg only"><img data-k="p0" alt=""></div></div></div><div class="mi"><div class="mcard pgc"><div class="pg"><div class="tx"><p></p><p>「幸せこそが真の反逆。」</p></div><span class="no">2</span></div></div></div><div id="mnav"><button id="mp" aria-label="Indietro">&#8249;</button><button id="mn" aria-label="Avanti">&#8250;</button></div></div>
<div id="meta">旅館 &nbsp;&middot;&nbsp; 原ロータ</div><a id="buy" href="https://www.studiopeacock.net/ryokan-ebook-giapponese/" target="_top">購入する</a></div>
<script>(function rt(){
 var D=JSON.parse(document.getElementById('pkbook').textContent);
 [].forEach.call(document.querySelectorAll('[data-k]'),function(el){
  var k=el.getAttribute('data-k');
  if(k==='c'){if(D.cover)el.style.backgroundImage='url("'+D.cover+'")';}
  else{var p=D.pages[+k.slice(1)];if(p&&p.i)el.src=p.i;}
 });
 function fit(){[].forEach.call(document.querySelectorAll('.tx'),function(el){el.style.fontSize='';if(!el.clientHeight)return;var f=1;while(el.scrollHeight>el.clientHeight+1&&f>.5){f-=.04;el.style.fontSize=f+'em';}});}
 window.addEventListener('resize',fit);window.addEventListener('load',fit);
 var bk=document.getElementById('bk'),leaves=[].slice.call(bk.querySelectorAll('.leaf')),L=leaves.length,cur=0,maxf=0;
 leaves.forEach(function(l,i){if(l.getAttribute('data-f')==='1')maxf=i+1;});
 function z(){leaves.forEach(function(l,i){l.style.zIndex=i<cur?i:(L-i);});}
 function go(n){
  n=Math.max(0,Math.min(maxf,n));if(n===cur)return;
  for(var i=Math.min(n,cur);i<Math.max(n,cur);i++)leaves[i].style.zIndex=L+5;
  cur=n;
  leaves.forEach(function(l,i){l.classList.toggle('flip',i<cur);});
  bk.classList.toggle('closed',cur===0);
  setTimeout(z,380);
 }
 z();fit();
 [].forEach.call(bk.querySelectorAll('.face.f'),function(f){f.addEventListener('click',function(){go(cur+1);});});
 [].forEach.call(bk.querySelectorAll('.face.b'),function(f){f.addEventListener('click',function(){go(cur-1);});});
 document.getElementById('nx').onclick=function(){go(cur+1);};
 document.getElementById('pv').onclick=function(){go(cur-1);};
 /* telefono: una pagina alla volta */
 var mi=[].slice.call(document.querySelectorAll('.mi')),ix=0;
 function show(n){ix=Math.max(0,Math.min(mi.length-1,n));mi.forEach(function(m,i){m.style.display=i===ix?'block':'none';});fit();}
 show(0);
 document.getElementById('mn').onclick=function(){show(ix+1);};
 document.getElementById('mp').onclick=function(){show(ix-1);};
 var sx=null,mob=document.getElementById('mob');
 mob.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
 mob.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>40)show(ix+(dx<0?1:-1));});
})();</script>
</body></html>
